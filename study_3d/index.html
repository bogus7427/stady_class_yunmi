<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 초등 공부나라</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jua', sans-serif; overflow: hidden; background: #0b1a3a; color: #222; }
  #scene { position: fixed; inset: 0; }
  #top {
    position: fixed; top: 0; left: 0; right: 0; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    color: #fff; pointer-events: none; z-index: 5;
  }
  #top h1 { font-size: 26px; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  #crumb { font-size: 18px; opacity: .9; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,.45); padding: 8px 18px; border-radius: 20px;
    font-size: 16px; z-index: 5; text-align: center;
  }
  #backBtn { position: fixed; top: 60px; left: 20px; z-index: 6; display: none; }
  button {
    font-family: inherit; font-size: 17px; border: none; border-radius: 12px;
    padding: 9px 18px; cursor: pointer; transition: transform .1s, filter .2s;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-main { background: #ffcc33; color: #333; box-shadow: 0 3px 0 #c9971a; }
  .btn-ans  { background: #4caf50; color: #fff; box-shadow: 0 3px 0 #2e7d32; }
  .btn-exp  { background: #2196f3; color: #fff; box-shadow: 0 3px 0 #1565c0; }
  .btn-gray { background: #e0e0e0; color: #333; box-shadow: 0 3px 0 #aaa; }

  #panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.9);
    width: min(1300px, calc(100% - 32px)); max-height: 94vh; overflow-y: auto;
    background: #fffdf5; border-radius: 30px; padding: 40px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); z-index: 10;
    opacity: 0; pointer-events: none; transition: all .25s;
  }
  #panel.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #panel .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  #panel .tag { background: #ffe082; padding: 8px 20px; border-radius: 14px; font-size: 28px; }
  #panel .count { color: #666; font-size: 26px; }
  #levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .lv { font-size: 30px; padding: 14px 6px; background: #eee; color: #555; box-shadow: 0 3px 0 #bbb; }
  .lv.on[data-lv="0"] { background: #8ce99a; color: #1b5e20; box-shadow: 0 3px 0 #51cf66; }
  .lv.on[data-lv="1"] { background: #74c0fc; color: #0d47a1; box-shadow: 0 3px 0 #339af0; }
  .lv.on[data-lv="2"] { background: #ffa94d; color: #7a3d00; box-shadow: 0 3px 0 #f76707; }
  .lv.on[data-lv="3"] { background: #ff6b6b; color: #fff; box-shadow: 0 3px 0 #c92a2a; }
  #qText { font-size: 40px; line-height: 1.55; margin: 10px 0 24px; white-space: pre-line; }
  #choices { display: grid; gap: 14px; margin-bottom: 18px; }
  .choice { text-align: left; background: #fff; border: 2px solid #ddd; box-shadow: none; font-size: 34px; padding: 16px 24px; border-width: 3px; }
  .choice.correct { border-color: #4caf50; background: #e8f5e9; }
  .choice.wrong { border-color: #f44336; background: #ffebee; }
  .toggles { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .reveal {
    position: relative; overflow: hidden; border-radius: 16px; font-size: 32px; white-space: pre-line;
    line-height: 1.6; padding: 20px 28px; margin-bottom: 16px; min-height: 96px; cursor: pointer;
  }
  .reveal .content { filter: blur(8px); user-select: none; transition: filter .3s; }
  .reveal .cover {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, rgba(0,0,0,.08) 0 10px, rgba(0,0,0,.03) 10px 20px);
    color: #555; font-size: 30px; transition: opacity .3s;
  }
  .reveal.open { cursor: default; }
  .reveal.open .content { filter: none; user-select: auto; }
  .reveal.open .cover { opacity: 0; pointer-events: none; }
  #ansBox { background: #e8f5e9; border-left: 10px solid #4caf50; }
  #expBox { background: #e3f2fd; border-left: 10px solid #2196f3; }
  .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 14px; }
  #panel .toggles button, #panel .nav button { font-size: 32px; padding: 16px 32px; border-radius: 18px; }
  #feedback { font-size: 36px; min-height: 48px; margin-bottom: 8px; }
  #dim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; display: none; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="top">
  <h1>🌈 3D 초등 공부나라</h1>
  <div id="crumb">운동장 › 학년 교실 문 앞 발판으로 가요</div>
</div>
<button id="backBtn" class="btn-main">🏫 운동장으로</button>
<div id="hint">⌨️ 방향키·WASD로 걷기 · 🖱️ 바닥 클릭으로 이동 · 드래그로 시점 회전</div>

<div id="dim"></div>
<div id="panel">
  <div class="head">
    <span class="tag" id="qTag"></span>
    <span class="count" id="qCount"></span>
  </div>
  <div id="levels">
    <button class="lv" data-lv="0">🌱 초급</button>
    <button class="lv" data-lv="1">🌿 중급</button>
    <button class="lv" data-lv="2">🌳 상급</button>
    <button class="lv" data-lv="3">🔥 최상급</button>
  </div>
  <div id="qText"></div>
  <div id="choices"></div>
  <div id="feedback"></div>
  <div class="toggles">
    <button class="btn-ans" id="ansBtn">✅ 정답 보기</button>
    <button class="btn-exp" id="expBtn">💡 해설 보기</button>
  </div>
  <div class="reveal" id="ansBox"></div>
  <div class="reveal" id="expBox"></div>
  <div class="nav">
    <button class="btn-gray" id="prevBtn">◀ 이전</button>
    <button class="btn-gray" id="closeBtn">닫기</button>
    <button class="btn-main" id="nextBtn">새 문제 ▶</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   🧩 문제 자동 생성 엔진
   - 수학: 학년·난이도별 규칙으로 숫자를 무작위로 만들어 무한히 출제
   - 그 밖의 과목: 개념 목록(POOLS)으로 난이도마다 출제 방식을 바꿈
       초급  : 설명 → 개념 고르기
       중급  : 개념 → 설명 고르기
       상급  : 옳지 않은 설명 고르기
       최상급: ㄱ·ㄴ·ㄷ 중 옳은 것을 모두 고르기
   - 이미 나온 문제는 localStorage에 기록해서 다시 나오지 않음
   ▶ 업그레이드: POOLS에 [개념, 설명]을 추가하거나 MATH에 규칙을 추가
   ========================================================= */
const LEVELS = ['초급', '중급', '상급', '최상급'];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const frac = (n, d) => { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? `${n}` : `${n}/${d}`; };

// 정답 + 오답 후보로 보기 4개 만들기
function choices(answer, wrongs) {
  const set = [String(answer)];
  for (const w of shuffle(wrongs.map(String))) { if (set.length >= 4) break; if (!set.includes(w)) set.push(w); }
  // 보기가 모자라면 정답 속 숫자를 조금씩 바꿔서 채움 (예: 92° → 93°, 91° …)
  const m = String(answer).match(/^(\D*)(\d+(?:\.\d+)?)(.*)$/);
  let k = 1; while (set.length < 4 && m && k < 50) { const v = m[1] + (Number(m[2]) + Math.ceil(k / 2) * (k % 2 ? 1 : -1)) + m[3]; if (!set.includes(v) && !v.includes('-')) set.push(v); k++; }
  return shuffle(set);
}
// 숫자 정답의 오답 후보
const near = (n, step = 1) => [n + step, n - step, n + 2 * step, n - 2 * step, n + 10, n - 10].filter(v => v >= 0);

/* ---------------- 수학 규칙 (학년 → 난이도 → 유형들) ---------------- */
const MATH = {
  1: [
    [() => { const a = rnd(1, 5), b = rnd(1, 4); return { q: `${a} + ${b} = ?`, a: a + b, w: near(a + b), e: `${a}에서 ${b}만큼 이어 세면 ${a + b}이에요.` }; },
     () => { const a = rnd(3, 9), b = rnd(1, a - 1); return { q: `${a} - ${b} = ?`, a: a - b, w: near(a - b), e: `${a}개에서 ${b}개를 빼면 ${a - b}개가 남아요.` }; }],
    [() => { const a = rnd(6, 9), b = rnd(3, 9); return { q: `${a} + ${b} = ?`, a: a + b, w: near(a + b), e: `${a}에 ${10 - a}을(를) 더해 10을 만들고, 남은 ${b - (10 - a)}을(를) 더하면 ${a + b}이에요.` }; },
     () => { const a = rnd(11, 18), b = rnd(a - 9, 9); return { q: `${a} - ${b} = ?`, a: a - b, w: near(a - b), e: `${a}에서 ${a - 10}을(를) 빼서 10을 만들고, 남은 ${b - (a - 10)}을(를) 더 빼면 ${a - b}이에요.` }; }],
    [() => { const a = rnd(11, 50), b = rnd(1, 9 - a % 10 || 1); return { q: `${a} + ${b} = ?`, a: a + b, w: near(a + b), e: `일의 자리끼리 더해요: ${a % 10} + ${b} = ${a % 10 + b} → ${a + b}` }; },
     () => { const a = rnd(2, 5) * 10, b = rnd(1, 4) * 10; return { q: `${a} + ${b} = ?`, a: a + b, w: near(a + b, 10), e: `10이 ${a / 10}개와 ${b / 10}개면 10이 ${(a + b) / 10}개 → ${a + b}` }; }],
    [() => { const a = rnd(2, 9), s = rnd(a + 1, 15); return { q: `□ + ${a} = ${s}\n□에 알맞은 수는?`, a: s - a, w: near(s - a), e: `□ = ${s} - ${a} = ${s - a}` }; },
     () => { const n = pick(['사탕', '구슬', '딱지', '스티커']), a = rnd(8, 15), b = rnd(2, 7); return { q: `${n}이(가) ${a}개 있었어요. 동생에게 ${b}개를 주었어요.\n남은 ${n}은(는) 몇 개일까요?`, a: a - b, w: near(a - b).concat([a + b]), e: `준 것은 빼기! ${a} - ${b} = ${a - b}개` }; }]
  ],
  2: [
    [() => { const a = rnd(15, 59), b = rnd(15, 39); return { q: `${a} + ${b} = ?`, a: a + b, w: near(a + b).concat([a + b - 10]), e: `일의 자리 ${a % 10}+${b % 10}, 받아올림을 잊지 말아요 → ${a + b}` }; },
     () => { const a = rnd(41, 90), b = rnd(12, 39); return { q: `${a} - ${b} = ?`, a: a - b, w: near(a - b).concat([a - b + 10]), e: `받아내림에 주의해요 → ${a} - ${b} = ${a - b}` }; }],
    [() => { const a = rnd(2, 5), b = rnd(2, 9); return { q: `${a} × ${b} = ?`, a: a * b, w: near(a * b, a), e: `${a}단: ${a}를 ${b}번 더해요 → ${a * b}` }; }],
    [() => { const a = rnd(6, 9), b = rnd(3, 9); return { q: `${a} × ${b} = ?`, a: a * b, w: near(a * b, a).concat([a * b + 1]), e: `${a} × ${b} = ${a * b} (${a}단 구구단)` }; },
     () => { const m = rnd(1, 4), c = rnd(10, 90); return { q: `${m}m ${c}cm는 몇 cm일까요?`, a: m * 100 + c, w: [m * 10 + c, m * 1000 + c, m * 100 + c + 10, m * 100 - c], e: `1m = 100cm 이므로 ${m}m = ${m * 100}cm, 더하면 ${m * 100 + c}cm` }; }],
    [() => { const a = rnd(3, 9), b = rnd(3, 9), it = pick(['연필', '과자', '공책']); return { q: `한 상자에 ${it}이(가) ${a}개씩 들어 있어요.\n${b}상자에는 모두 몇 개일까요?`, a: a * b, w: near(a * b, a).concat([a + b]), e: `${a}개씩 ${b}묶음 → ${a} × ${b} = ${a * b}개` }; },
     () => { const a = rnd(3, 9), r = rnd(3, 9); return { q: `□ × ${a} = ${a * r}\n□에 알맞은 수는?`, a: r, w: near(r), e: `${a}단에서 ${a * r}이 나오는 수를 찾아요 → ${r}` }; }]
  ],
  3: [
    [() => { const a = rnd(120, 599), b = rnd(110, 399); return { q: `${a} + ${b} = ?`, a: a + b, w: near(a + b, 10).concat([a + b - 100]), e: `일·십·백의 자리 순서로 더하고 받아올림 → ${a + b}` }; },
     () => { const a = rnd(500, 900), b = rnd(120, 480); return { q: `${a} - ${b} = ?`, a: a - b, w: near(a - b, 10).concat([a - b + 100]), e: `받아내림에 주의해서 빼요 → ${a - b}` }; }],
    [() => { const a = rnd(12, 49), b = rnd(3, 9); return { q: `${a} × ${b} = ?`, a: a * b, w: near(a * b, b).concat([a * b + 10]), e: `${a} × ${b} = (${Math.floor(a / 10) * 10} × ${b}) + (${a % 10} × ${b}) = ${a * b}` }; },
     () => { const b = rnd(3, 9), q = rnd(4, 12); return { q: `${b * q} ÷ ${b} = ?`, a: q, w: near(q), e: `${b} × ${q} = ${b * q} 이므로 몫은 ${q}` }; }],
    [() => { const b = rnd(3, 9), q = rnd(4, 11), r = rnd(1, b - 1), n = b * q + r; return { q: `${n} ÷ ${b}의 몫과 나머지는?`, a: `몫 ${q}, 나머지 ${r}`, w: [`몫 ${q + 1}, 나머지 ${r}`, `몫 ${q}, 나머지 ${r + 1}`, `몫 ${q - 1}, 나머지 ${r + b}`, `몫 ${r}, 나머지 ${q}`], e: `${b} × ${q} = ${b * q}, ${n} - ${b * q} = ${r}\n나머지는 나누는 수 ${b}보다 작아야 해요.` }; },
     () => { const d = pick([5, 6, 7, 8, 9, 10]), [x, y] = shuffle([...Array(d - 1)].map((_, i) => i + 1)).slice(0, 2), big = Math.max(x, y); return { q: `${x}/${d} 와 ${y}/${d} 중 더 큰 분수는?`, a: `${big}/${d}`, w: [`${Math.min(x, y)}/${d}`, '두 분수는 같다', `${big}/${d + 1}`, `${d}/${big}`], e: `분모가 같으면 분자가 큰 쪽이 더 커요 → ${big}/${d}` }; }],
    [() => { const d = pick([2, 3, 4, 5, 6]), k = rnd(2, 6), n = rnd(1, d - 1), it = pick(['귤', '쿠키', '사탕']); return { q: `${it} ${d * k}개의 ${n}/${d}은(는) 몇 개일까요?`, a: k * n, w: near(k * n, k).concat([d * k - k * n]), e: `${d * k}개를 ${d}묶음으로 나누면 한 묶음에 ${k}개, ${n}묶음은 ${k * n}개` }; },
     () => { const b = rnd(4, 8), q = rnd(5, 9), r = rnd(1, b - 1); return { q: `학생 ${b * q + r}명이 한 줄에 ${b}명씩 서요.\n남김없이 모두 서려면 최소 몇 줄이 필요할까요?`, a: q + 1, w: [q, q + 2, r, b], e: `${b * q + r} ÷ ${b} = ${q} … ${r}\n남은 ${r}명도 한 줄이 필요하므로 ${q + 1}줄` }; }]
  ],
  4: [
    [() => { const a = rnd(120, 450), b = rnd(12, 45); return { q: `${a} × ${b} = ?`, a: a * b, w: near(a * b, 10).concat([a * b + 100, a * (b % 10)]), e: `${a} × ${b % 10} = ${a * (b % 10)}, ${a} × ${b - b % 10} = ${a * (b - b % 10)}\n더하면 ${a * b}` }; }],
    [() => { const b = rnd(12, 35), q = rnd(6, 29), r = rnd(0, b - 1), n = b * q + r; return { q: `${n} ÷ ${b}의 몫은?`, a: q, w: near(q), e: `${b} × ${q} = ${b * q}${r ? `, 나머지 ${r}` : ''} → 몫 ${q}` }; }],
    [() => { const d = rnd(5, 12), a = rnd(1, d - 2), b = rnd(1, d - 1 - a); return { q: `${a}/${d} + ${b}/${d} = ?`, a: `${a + b}/${d}`, w: [`${a + b}/${d * 2}`, `${a + b + 1}/${d}`, `${a * b}/${d}`, `${Math.abs(a - b)}/${d}`], e: `분모가 같으면 분자끼리 더해요: ${a} + ${b} = ${a + b} → ${a + b}/${d}` }; },
     () => { const w = rnd(2, 4), d = rnd(3, 8), n = rnd(1, d - 1); return { q: `${w}과 ${n}/${d}을(를) 가분수로 나타내면?`, a: `${w * d + n}/${d}`, w: [`${w + n}/${d}`, `${w * n + d}/${d}`, `${w * d}/${d}`, `${w * d + n}/${d + 1}`], e: `${w} × ${d} + ${n} = ${w * d + n} → ${w * d + n}/${d}` }; }],
    [() => { const a = rnd(30, 90), b = rnd(20, 150 - a); return { q: `삼각형의 두 각이 ${a}°, ${b}°일 때 나머지 한 각은?`, a: `${180 - a - b}°`, w: [`${360 - a - b}°`, `${180 - a - b + 10}°`, `${a + b}°`, `${90 - Math.min(a, 89)}°`], e: `삼각형 세 각의 합은 180° → 180 - ${a} - ${b} = ${180 - a - b}°` }; },
     () => { const a = rnd(60, 120), b = rnd(60, 110), c = rnd(50, 100); return { q: `사각형의 세 각이 ${a}°, ${b}°, ${c}°일 때 나머지 한 각은?`, a: `${360 - a - b - c}°`, w: [`${180 - (a + b + c) % 180}°`, `${360 - a - b - c + 10}°`, `${360 - a - b - c - 10}°`, `${a}°`], e: `사각형 네 각의 합은 360° → 360 - ${a} - ${b} - ${c} = ${360 - a - b - c}°` }; }]
  ],
  5: [
    [() => { const g = rnd(2, 6), a = g * rnd(2, 5), b = g * rnd(2, 7); return { q: `${a}와(과) ${b}의 최대공약수는?`, a: gcd(a, b), w: [lcm(a, b), gcd(a, b) * 2, 1, gcd(a, b) + 1], e: `두 수를 함께 나누는 가장 큰 수 → ${gcd(a, b)}` }; },
     () => { const a = rnd(2, 9), b = rnd(3, 12); return { q: `${a}와(과) ${b}의 최소공배수는?`, a: lcm(a, b), w: [a * b === lcm(a, b) ? a * b + a : a * b, gcd(a, b), lcm(a, b) * 2, a + b], e: `${a}와 ${b}의 공통 배수 중 가장 작은 수 → ${lcm(a, b)}` }; }],

/* ---------------- 개념 목록으로 난이도별 문제 만들기 ---------------- */
const TPL0 = [d => `'${d}'에 알맞은 것은?`, d => `다음 설명에 맞는 것을 고르세요.\n▶ ${d}`, d => `"${d}" — 이것은 무엇일까요?`];
const TPL1 = [k => `'${k}'의 뜻(설명)으로 알맞은 것은?`, k => `다음 중 '${k}'을(를) 바르게 설명한 것은?`, k => `'${k}'에 대한 설명을 고르세요.`];

function genPool(pool, lv) {
  const L = pool.list;
  if (lv === 0) { // 설명 → 개념
    const [k, d] = pick(L), t = rnd(0, TPL0.length - 1);
    return { q: TPL0[t](d), a: k, c: choices(k, L.filter(x => x[0] !== k).map(x => x[0])), e: `'${k}' : ${d}`, key: `0|${t}|${k}` };
  }
  if (lv === 1) { // 개념 → 설명
    const [k, d] = pick(L), t = rnd(0, TPL1.length - 1);
    return { q: TPL1[t](k), a: d, c: choices(d, L.filter(x => x[0] !== k).map(x => x[1])), e: `'${k}' : ${d}`, key: `1|${t}|${k}` };
  }
  if (lv === 2) { // 옳지 않은 것 고르기
    const four = shuffle(L).slice(0, 4), bad = rnd(0, 3);
    const others = L.filter(x => x[0] !== four[bad][0] && !four.some(f => f[1] === x[1]));
    const wrongD = pick(others.length ? others : L.filter(x => x[0] !== four[bad][0]))[1];
    const st = four.map((f, i) => `${f[0]} : ${i === bad ? wrongD : f[1]}`);
    return { q: `다음 중 설명이 옳지 않은 것은?`, a: st[bad], c: st, e: `'${four[bad][0]}'의 바른 설명은\n→ ${four[bad][1]}\n('${wrongD}'은(는) 다른 개념의 설명이에요.)`, key: `2|${four.map(f => f[0]).join(',')}|${bad}` };
  }
  // 최상급: ㄱㄴㄷ 모두 고르기
  const three = shuffle(L).slice(0, 3), marks = ['ㄱ', 'ㄴ', 'ㄷ'];
  let truth; do { truth = three.map(() => Math.random() < 0.5); } while (!truth.some(Boolean));
  const lines = three.map((f, i) => {
    if (truth[i]) return { s: `${marks[i]}. ${f[0]} — ${f[1]}`, fix: null };
    const wd = pick(L.filter(x => x[0] !== f[0]))[1];
    return { s: `${marks[i]}. ${f[0]} — ${wd}`, fix: `${marks[i]}. ${f[0]}의 바른 설명: ${f[1]}` };
  });
  const combos = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄱ, ㄴ', 'ㄱ, ㄷ', 'ㄴ, ㄷ', 'ㄱ, ㄴ, ㄷ'];
  const ans = marks.filter((_, i) => truth[i]).join(', ');
  const fixes = lines.filter(l => l.fix).map(l => '✗ ' + l.fix);
  return {
    q: `옳은 설명을 <보기>에서 모두 고른 것은?\n\n<보기>\n${lines.map(l => l.s).join('\n')}`,
    a: ans, c: choices(ans, combos.filter(c => c !== ans)),
    e: `옳은 것: ${ans}${fixes.length ? '\n' + fixes.join('\n') : ''}`,
    key: `3|${three.map((f, i) => f[0] + (truth[i] ? 'T' : 'F')).join(',')}`
  };
}

function genMath(g, lv) {
  const raw = pick(MATH[g][lv])();
  return { q: raw.q, a: String(raw.a), c: choices(raw.a, raw.w), e: raw.e, key: raw.q };
}

const SEEN_KEY = 'study3d_seen_v1';
let seen = {};
try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { seen = {}; }
const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} };

function makeQuestion(g, s, lv) {
  const bucket = `${g}|${s}|${lv}`;
  seen[bucket] = seen[bucket] || [];
  let item, reset = false;
  for (let tries = 0; tries < 80; tries++) {
    item = s === '수학' ? genMath(g, lv) : genPool(POOLS[g][s], lv);
    if (!seen[bucket].includes(item.key)) break;
    item = null;
  }
  if (!item) { // 이 단계 문제를 모두 풀었으면 기록을 비우고 다시 시작
    seen[bucket] = []; reset = true;
    item = s === '수학' ? genMath(g, lv) : genPool(POOLS[g][s], lv);
  }
  seen[bucket].push(item.key); saveSeen();
  item.reset = reset;
  return item;
}

head.position.y = 2.85; head.castShadow = true; avatar.add(head);
const hair = new THREE.Mesh(new THREE.SphereGeometry(0.63, 20, 16, 0, Math.PI * 2, 0, Math.PI / 2.1), mat(0x4e342e));
hair.position.y = 2.9; avatar.add(hair);
[-0.22, 0.22].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), mat(0x222222)); e.position.set(x, 2.9, 0.53); avatar.add(e); });
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.03, 6, 12, Math.PI), mat(0xc0392b));
mouth.position.set(0, 2.68, 0.55); mouth.rotation.z = Math.PI; avatar.add(mouth);
box(0.9, 1.0, 0.4, 0x1e88e5, 0, 1.8, -0.6, avatar);   // 책가방
const me = makeLabel('나', '#ffcc33', '#333', 128, 80, 48); me.position.y = 4; me.scale.multiplyScalar(0.7); avatar.add(me);
avatar.position.set(0, 0, 8);

/* ----- 이동 / 카메라 ----- */
let area = 'yard', curGrade = null, lastGrade = 1, activePad = null;
let camYaw = 0, camYawT = 0, moveTarget = null, walkT = 0;
const keys = {};
const BOUNDS = { yard: [-32, 32, -12.8, 22], class: [-14.5, 14.5, -11, 11.5] };

addEventListener('keydown', e => {
  if (panel.classList.contains('show')) return;
  keys[e.key.toLowerCase()] = true;
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let dragging = false, lastX = 0, moved = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; moved = 0; });
addEventListener('pointerup', e => { const was = dragging; dragging = false; if (was && moved < 6) onClick(e); });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
  camYawT -= dx * 0.008;
});

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function onClick(e) {
  if (panel.classList.contains('show') || e.target !== renderer.domElement) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(clickTargets, false)[0];
  if (!hit) return;
  const pad = [...yardPads, ...classPads].find(p => p.mesh === hit.object);
  moveTarget = pad ? pad.pos.clone() : hit.point.clone().setY(0);
}

function snapCamera() {
  curLook.copy(avatar.position).add(new THREE.Vector3(0, 2, 0));
  camera.position.set(avatar.position.x + Math.sin(camYaw) * 13, avatar.position.y + 8, avatar.position.z + Math.cos(camYaw) * 13);
}

function enterGrade(g) {
  area = 'class'; curGrade = g; lastGrade = g; moveTarget = null;
  buildClassroom(g);
  avatar.position.copy(CLASS_ORIGIN).add(new THREE.Vector3(0, 0, 7.5));
  avatar.rotation.y = Math.PI;
  camYaw = camYawT = 0; activePad = null; snapCamera();
  document.getElementById('crumb').textContent = `${g}학년 교실 › 과목 발판으로 걸어가요`;
  document.getElementById('backBtn').style.display = 'block';
}
function goYard() {
  area = 'yard'; curGrade = null; moveTarget = null;
  const door = yardPads[lastGrade - 1].pos;
  avatar.position.set(door.x, 0, door.z + 3.5); avatar.rotation.y = 0;
  camYaw = camYawT = 0; activePad = null; snapCamera();
  document.getElementById('crumb').textContent = '운동장 › 학년 교실 문 앞 발판으로 가요';
  document.getElementById('backBtn').style.display = 'none';
}
document.getElementById('backBtn').onclick = goYard;

function triggerPad(p) {
  moveTarget = null; for (const k in keys) keys[k] = false;
  if (p.type === 'grade') enterGrade(p.grade);
  else if (p.type === 'subject') openQuiz(curGrade, p.subject);
  else if (p.type === 'exit') goYard();
}

const curLook = new THREE.Vector3();
function updateAvatar(dt, t) {
  const busy = panel.classList.contains('show');
  let dx = 0, dz = 0;
  if (!busy) {
    const f = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
    const r = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    if (f || r) {
      moveTarget = null;
      const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
      dx = fx * f + (-fz) * r; dz = fz * f + fx * r;
    } else if (moveTarget) {
      dx = moveTarget.x - avatar.position.x; dz = moveTarget.z - avatar.position.z;
      if (Math.hypot(dx, dz) < 0.15) { moveTarget = null; dx = dz = 0; }
    }
  }
  const len = Math.hypot(dx, dz), walking = len > 0;
  if (walking) {
    const step = Math.min(9 * dt, moveTarget ? len : Infinity);
    avatar.position.x += dx / len * step; avatar.position.z += dz / len * step;
    const want = Math.atan2(dx, dz);
    let diff = want - avatar.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    avatar.rotation.y += diff * Math.min(1, dt * 12);
    walkT += dt * 11;
  } else walkT *= 0.85;
  // 이동 범위 제한
  const b = BOUNDS[area], o = area === 'class' ? CLASS_ORIGIN : new THREE.Vector3();
  avatar.position.x = Math.max(o.x + b[0], Math.min(o.x + b[1], avatar.position.x));
  avatar.position.z = Math.max(o.z + b[2], Math.min(o.z + b[3], avatar.position.z));
  // 걷는 동작
  const sw = Math.sin(walkT) * (walking ? 0.7 : 0);
  legL.rotation.x = sw; legR.rotation.x = -sw; armL.rotation.x = -sw; armR.rotation.x = sw;
  avatar.position.y = walking ? Math.abs(Math.sin(walkT)) * 0.12 : 0;

  // 발판 확인 (발판을 벗어났다가 다시 올라가야 다시 작동)
  const pads = area === 'yard' ? yardPads : classPads;
  const on = pads.find(p => Math.hypot(p.pos.x - avatar.position.x, p.pos.z - avatar.position.z) < 1.5);
  if (on && on !== activePad && !busy) { activePad = on; triggerPad(on); }
  else if (!on) activePad = null;
  pads.forEach((p, i) => { p.mesh.material.emissiveIntensity = 0.35 + Math.sin(t * 3 + i) * 0.25; });

  // 카메라 따라가기
  camYaw += (camYawT - camYaw) * 0.12;
  const look = avatar.position.clone().setY(2);
  curLook.lerp(look, 0.15);
  const camWant = new THREE.Vector3(avatar.position.x + Math.sin(camYaw) * 13, 8, avatar.position.z + Math.cos(camYaw) * 13);
  camera.position.lerp(camWant, 0.1);
  camera.lookAt(curLook);
  sun.position.set(avatar.position.x + 15, 30, avatar.position.z + 12);
  sun.target.position.copy(avatar.position);
}
snapCamera();

/* ================== 문제 패널 ================== */
const panel = document.getElementById('panel'), dim = document.getElementById('dim');
const ansBox = document.getElementById('ansBox'), expBox = document.getElementById('expBox');
const ansBtn = document.getElementById('ansBtn'), expBtn = document.getElementById('expBtn');
let qGrade, qSubj, qLevel = 0, history = [], hIdx = -1, score = { ok: 0, tried: 0 };

function openQuiz(g, s) {
  qGrade = g; qSubj = s; history = []; hIdx = -1; score = { ok: 0, tried: 0 };
  setLevel(qLevel);
  panel.classList.add('show'); dim.style.display = 'block';
}
function closeQuiz() { panel.classList.remove('show'); dim.style.display = 'none'; }

function setLevel(lv) {
  qLevel = lv;
  document.querySelectorAll('.lv').forEach(b => b.classList.toggle('on', +b.dataset.lv === lv));
  newQuestion();
}
document.querySelectorAll('.lv').forEach(b => b.onclick = () => setLevel(+b.dataset.lv));

function newQuestion() {
  const item = makeQuestion(qGrade, qSubj, qLevel);
  item.level = qLevel; item.picked = null;
  history = history.slice(0, hIdx + 1); history.push(item); hIdx = history.length - 1;
  renderQ();
}

function setReveal(box, btn, open, labelOn, labelOff) {
  box.classList.toggle('open', open);
  btn.textContent = open ? labelOff : labelOn;
}

function renderQ() {
  const item = history[hIdx];
  document.getElementById('qTag').textContent = `${qGrade}학년 · ${SUBJECT_STYLE[qSubj].icon} ${qSubj} · ${LEVELS[item.level]}`;
  document.getElementById('qCount').textContent = `${hIdx + 1}번째 문제 · 맞힘 ${score.ok}/${score.tried}`;
  document.getElementById('qText').textContent = `Q${hIdx + 1}. ${item.q}`;
  const fb = document.getElementById('feedback');
  fb.textContent = item.reset ? '🔄 이 단계 문제를 모두 풀어서 처음부터 다시 섞었어요!' : '';
  ansBox.innerHTML = `<div class="content"><b>정답:</b> ${item.a}</div><div class="cover">🔒 정답이 가려져 있어요 · [정답 보기]를 눌러요</div>`;
  expBox.innerHTML = `<div class="content"><b>해설:</b> ${item.e}</div><div class="cover">🔒 해설이 가려져 있어요 · [해설 보기]를 눌러요</div>`;
  setReveal(ansBox, ansBtn, false, '✅ 정답 보기', '🙈 정답 가리기');
  setReveal(expBox, expBtn, false, '💡 해설 보기', '🙈 해설 가리기');

  const ch = document.getElementById('choices'); ch.innerHTML = '';
  item.c.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = `${'①②③④⑤'[i]} ${c}`;
    if (item.picked === c) b.classList.add(c === item.a ? 'correct' : 'wrong');
    b.onclick = () => {
      if (item.picked === null) { score.tried++; if (c === item.a) score.ok++; }
      item.picked = c;
      ch.querySelectorAll('.choice').forEach(x => x.classList.remove('correct', 'wrong'));
      const ok = c === item.a;
      b.classList.add(ok ? 'correct' : 'wrong');
      fb.textContent = ok ? '🎉 정답이에요! 잘했어요!' : '🤔 다시 생각해 볼까요?';
      document.getElementById('qCount').textContent = `${hIdx + 1}번째 문제 · 맞힘 ${score.ok}/${score.tried}`;
    };
    ch.appendChild(b);
  });
  document.getElementById('prevBtn').disabled = hIdx === 0;
  document.getElementById('nextBtn').textContent = hIdx < history.length - 1 ? '다음 ▶' : '새 문제 ▶';
}

ansBtn.onclick = () => setReveal(ansBox, ansBtn, !ansBox.classList.contains('open'), '✅ 정답 보기', '🙈 정답 가리기');
expBtn.onclick = () => setReveal(expBox, expBtn, !expBox.classList.contains('open'), '💡 해설 보기', '🙈 해설 가리기');
ansBox.onclick = () => { if (!ansBox.classList.contains('open')) ansBtn.onclick(); };
expBox.onclick = () => { if (!expBox.classList.contains('open')) expBtn.onclick(); };
document.getElementById('prevBtn').onclick = () => { if (hIdx > 0) { hIdx--; renderQ(); } };
document.getElementById('nextBtn').onclick = () => { if (hIdx < history.length - 1) { hIdx++; renderQ(); } else newQuestion(); };
document.getElementById('closeBtn').onclick = closeQuiz;
dim.onclick = closeQuiz;

/* ================== 애니메이션 ================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updateAvatar(dt, t);
  flag.rotation.y = Math.sin(t * 2) * 0.15;
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
